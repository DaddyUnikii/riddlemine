name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FE_VERSION: v26.5.0
  FE_SHA256: 3732fbe8a6e9d2ea3925d02d0e3a1478bc1e01d742c2be75d3ea7300c46c45f0

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install verified Fe release
        run: |
          mkdir -p "$HOME/.fe/bin"
          curl -fsSL "https://github.com/argotorg/fe/releases/download/$FE_VERSION/fe_linux_amd64" -o "$HOME/.fe/bin/fe"
          printf '%s  %s\n' "$FE_SHA256" "$HOME/.fe/bin/fe" | sha256sum --check --strict
          chmod +x "$HOME/.fe/bin/fe"
          printf '%s\n' "$HOME/.fe/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.9.0
      - name: Install hash-pinned Python dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - run: fe --version
      - run: fe fmt --check
      - run: fe test
      - run: fe build
      - name: Python and local EVM regressions
        env:
          LOCAL_EVM_RPC: http://127.0.0.1:18556
          RUN_LOCAL_V3: '1'
        run: |
          anvil --host 127.0.0.1 --port 18556 --chain-id 97 --silent > "$RUNNER_TEMP/riddlemine-anvil.log" 2>&1 &
          anvil_pid=$!
          trap 'kill "$anvil_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 50); do
            if curl -fsS -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' "$LOCAL_EVM_RPC" > /dev/null; then
              break
            fi
            sleep 0.1
          done
          set +e
          python -m unittest discover -s tests -v > "$RUNNER_TEMP/python.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/python.log"
          if ! grep -Eq '^Ran [1-9][0-9]* tests? in ' "$RUNNER_TEMP/python.log"; then
            echo '::error::no tests executed in the required suite'
            exit 1
          fi
          if grep -Eq '^OK \(.*skipped=[1-9][0-9]*| \.\.\. skipped ' "$RUNNER_TEMP/python.log"; then
            echo '::error::skipped tests are not a passing EVM/provenance run'
            exit 1
          fi
          exit "$status"

  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '20'
      - name: Rebuild official Pancake V3 creation bytecode from pinned inputs
        run: |
          npm ci --prefix tests/fixtures/pancake_v3/toolchain --ignore-scripts --no-audit --no-fund
          node tests/fixtures/pancake_v3/rebuild.cjs
